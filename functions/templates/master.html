<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <style>
    /* A4 PAGE SIZE FIX */
    @page {
      size: A4;
      margin: 0;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      color: #222;
      font-size: 14px;
      box-sizing: border-box;
      padding: 40px 50px;
      height: 100vh; /* FULL PAGE HEIGHT */
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 120px;
      height: auto;
    }

    .divider {
      width: 100%;
      height: 2px;
      background: #444;
      margin: 20px 0;
      opacity: 0.5;
    }

    /* CONTENT SHOULD TAKE AVAILABLE SPACE */
    .content-area {
      flex: 1; /* THE MAGIC: PUSHES FOOTER TO BOTTOM */
      margin-top: 10px;
      line-height: 1.6;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }

    table th {
      text-align: left;
      padding: 8px;
      background: #f0f0f0;
      border-bottom: 1px solid #ccc;
    }

    table td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }

    /* FULL-WIDTH RED STRIP FOOTER FIXED AT BOTTOM */
    .footer-wrapper {
      margin-left: -50px;
      margin-right: -50px;
    }

    .footer {
      background: #8c191b;
      color: white;
      padding: 14px 50px;
      font-size: 12px;
      line-height: 1.45;
      width: 100%;
      text-align: left;
      box-sizing: border-box;
    }

    .trust-line {
      margin-top: 3px;
      font-size: 11.5px;
      opacity: 0.95;
    }

  </style>
</head>

<body>

  <div class="header">
    <img src="main/public/pdflogos.svg" class="logo" />
  </div>

  <div class="divider"></div>

  <div class="content-area">
    {{{content}}}
  </div>

  <div class="footer-wrapper">
    <div class="footer">
      The Elden Heights School | Opposite B.S.F Firing Range, Siwar, Hazaribagh 825317<br />
      CBSE Affiliation No. XXXXXXX | Contact: +91 9431904333 | www.eldenheights.org
      <div class="trust-line">
        A unit of Bhagwati Educational and Charitable Trust
      </div>
    </div>
  </div>

</body>
</html>
